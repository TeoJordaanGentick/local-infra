# ============================================================
# NanoMQ ACL — TalosOT edge broker (HOCON; NanoMQ 0.24.x schema).
# Included by nanomq.conf -> auth.acl. Rules are evaluated top-to-bottom,
# first match wins; anything that matches no rule is denied (auth.no_match =
# deny, and the trailing catch-all below).
#
# Three roles, keyed on the broker username (see nanomq_pwd.conf):
#
#   service (talosot) — api + nexus. Broad pub/sub: they ingest all telemetry
#                       and issue every DCMD/NCMD on the operator's behalf.
#   node    (node)    — Talos devices. Publish their own Sparkplug telemetry,
#                       subscribe only to the commands addressed to them.
#   viewer  (viewer)  — browsers (the Flutter SPA). Read-only: subscribe to the
#                       Sparkplug namespace, NEVER publish anywhere. This is the
#                       A-02 keystone — a compromised SPA session (XSS, a leaked
#                       token, a reader of localStorage) cannot command a plant.
#
# NOTE (A-04 / N-03): real node firmware still authenticates as the shared
# `talosot` service account today, so the `node` role below is not yet exercised
# by live devices — it is the target account for the firmware once per-node
# provisioning lands. Rolling firmware onto it is deliberately out of scope here.
# ============================================================

rules = [
	# ── service: api + nexus — full pub/sub on every topic.
	{"permit": "allow", "username": "talosot", "action": "pubsub", "topics": ["#"]}

	# ── node: publish own telemetry (BIRTH / DEATH / DATA), node- and
	#    device-scoped. The second path segment (+) is the Sparkplug group_id.
	{"permit": "allow", "username": "node", "action": "publish", "topics": [
		"spBv1.0/+/NBIRTH/#", "spBv1.0/+/DBIRTH/#",
		"spBv1.0/+/NDATA/#",  "spBv1.0/+/DDATA/#",
		"spBv1.0/+/NDEATH/#", "spBv1.0/+/DDEATH/#"
	]}
	# ── node: subscribe only to the commands addressed to it, plus primary-host
	#    STATE (Sparkplug §5.4 — a node watches the host it reports to).
	{"permit": "allow", "username": "node", "action": "subscribe", "topics": [
		"spBv1.0/+/NCMD/#", "spBv1.0/+/DCMD/#", "spBv1.0/+/STATE/#"
	]}

	# ── viewer: explicit publish denial first (defence in depth — the default
	#    deny below already blocks it, but this documents intent and survives a
	#    careless future broad-allow), then the read-only subscription the SPA
	#    needs for live data.
	{"permit": "deny",  "username": "viewer", "action": "publish",   "topics": ["#"]}
	{"permit": "allow", "username": "viewer", "action": "subscribe", "topics": ["spBv1.0/#"]}

	# ── default: deny anything not explicitly allowed above.
	{"permit": "deny"}
]
