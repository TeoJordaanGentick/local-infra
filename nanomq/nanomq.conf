# ============================================================
# NanoMQ — local-infra SHARED broker (HOCON; NanoMQ 0.24.x schema).
# Mounted read-only at /etc/nanomq.conf. The image entrypoint runs
# `nanomq start`, which reads this path by default.
#
# This config currently carries TalosOT's Sparkplug B account/ACL model, since
# talosot is the only local app using MQTT. When another app adopts the broker,
# add its account to nanomq_pwd.conf (via the MQTT_* vars) and its rules to
# nanomq_acl.conf — this file rarely needs to change.
# ============================================================

mqtt {
    property_size        = 32
    # A-09: a Sparkplug B payload for this fleet is a few KB at most. 256KB is a
    # generous ceiling that still forecloses the "one device pushes a 256MB
    # message into every open browser tab" amplification the old 256MB allowed.
    #
    # CAVEAT (verified on NanoMQ 0.24.13): this limit is enforced only for MQTT
    # v5 clients — an oversize v5 PUBLISH drops the connection. NanoMQ does NOT
    # reject an oversize MQTT v3.1.1 PUBLISH, and both the SPA and the Sparkplug
    # devices use v3.1.1. So this ceiling is defence-in-depth, not the guarantee.
    # The real protection against an oversize payload is the decode-side cap in
    # the consumers (go-nexus sparkplug.Decode enforces MaxPayloadBytes; the Dart
    # decoder is a TODO — see A-09 in _docs/SCRUM.md).
    max_packet_size      = 256KB
    max_mqueue_len       = 2048
    retry_interval       = 10s
    keepalive_multiplier = 1.25
}

# Plain MQTT — api, nexus and the Talos Node firmware connect here.
listeners.tcp {
    bind = "0.0.0.0:1883"
}

# MQTT-over-WebSocket for the Flutter SPA. local-infra's nginx reverse-proxies
# /mqtt to this listener (see ../nginx/nginx.conf). The /mqtt suffix MUST stay.
listeners.ws {
    bind = "0.0.0.0:8083/mqtt"
}

log {
    to    = [file, console]
    level = warn
    # compose bind-mounts ${HOST_DATA_ROOT}/mqtt-broker to /mqtt-broker; docker
    # creates the host directory on first start.
    dir   = "/mqtt-broker"
    file  = "nanomq.log"
    rotation {
        size  = 10MB
        count = 5
    }
}

# A-02 / A-09: role-partitioned accounts, not one shared god-account.
#   talosot → service (api, nexus): broad pub/sub.
#   node    → devices: pub telemetry, sub commands.
#   viewer  → browsers: subscribe-only; NEVER publish. go-api hands ONLY the
#             viewer account to the SPA via GET /mqtt/credentials.
# NanoMQ has no env templating, so the accounts live in nanomq_pwd.conf and the
# rules in nanomq_acl.conf — keep them in sync with the MQTT_*_USER /
# MQTT_*_PASSWORD pairs in .env. no_match = deny makes the ACL fail-closed: a
# topic/action matching no rule is rejected rather than allowed.
auth {
    allow_anonymous = false
    no_match        = deny
    deny_action     = ignore
    password = {include "/etc/nanomq_pwd.conf"}
    acl      = {include "/etc/nanomq_acl.conf"}
}
