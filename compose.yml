# local-infra — SHARED PUBLIC INFRASTRUCTURE for this local dev box.
#
# The leaner, LOCAL equivalent of gentick-infra: it provides the backing services
# (nginx, postgres, mqtt, questdb, redis) that every app stack on this box reaches
# BY NAME over one shared docker network, so they can each run their own PRIVATE
# stack alongside it instead of every app bringing up its own postgres/nginx and
# colliding on ports 5432/80.
#
#   ./svc-build-env.sh     # build .env from .env.example (+ pragma creds)
#   ./svc-gen-nanomq.sh    # render the broker password + ACL files from .env
#   docker compose up -d   # bring the stack up
#
# ── Conventions (kept in step with gentick-infra) ────────────────────────
#
# Ports and hostnames are HARDCODED here, not in .env — so the running values are
# read in one place. .env carries only the database name and the secrets. Image
# tags live here too, never in .env, so the running version is visible in git
# history rather than in an untracked file.
#
# Two things that bite silently:
#   1. Compose interpolates .env, so a literal $ in a secret must be DOUBLED
#      (pa$$word). svc-build-env.sh handles this.
#   2. Do NOT set COMPOSE_PROJECT_NAME — it outranks the network `name:` below and
#      would rename every container on the box.

services:
  # ************************** Nginx (reverse proxy + static host) **************************
  # Routes by server_name (see nginx/nginx.conf): localhost / talosot.localhost
  # serve the talosot bundle and proxy /api -> talosot-api, /mqtt -> mqtt;
  # rms.localhost serves the rms bundle and proxies /api -> rms-api. Bundles are
  # bind-mounted from nginx/html/<app>/. The WHOLE nginx.conf is mounted (not just
  # a server block) because its http block carries the `.mjs -> text/javascript`
  # mime fix a Flutter --wasm build needs.
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    # Published on all interfaces so http://localhost/ works with no hosts edit.
    ports:
      - "80:80"
    networks:
      - backend-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "local"
      options:
        max-size: "1m"
        max-file: "3"

  # ************************** NanoMQ (MQTT broker — shared with TalosOT) **************************
  # Pinned to 0.24.13, NOT 0.24.14: 0.24.14 carries a WebSocket regression that
  # talosot-edge-infra pinned away from (commit c8b4e26) and a suspected fd leak
  # that wedged the broker on gentickit.local. Do not bump without re-testing a
  # browser session that reconnects repeatedly, which is what drives the leak.
  #
  # nanomq_pwd.conf and nanomq_acl.conf are GENERATED from .env by
  # svc-gen-nanomq.sh (both gitignored) — run it before `docker compose up` or the
  # broker crash-loops on an empty bind-mount stub.
  mqtt:
    image: emqx/nanomq:0.24.13-full
    container_name: mqtt
    restart: unless-stopped
    command: ["--conf", "/etc/nanomq.conf"]
    environment:
      TZ: ${TZ}
    # The container default of 1024 fds is low for a broker and is what turned a
    # slow leak into an outage on the server. Raise the ceiling; it does not fix a
    # leak, so a rising fd count is still a bug.
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8083:8083"
    networks:
      - backend-net
    volumes:
      - ./nanomq/nanomq.conf:/etc/nanomq.conf:ro
      - ./nanomq/nanomq_pwd.conf:/etc/nanomq_pwd.conf:ro
      - ./nanomq/nanomq_acl.conf:/etc/nanomq_acl.conf:ro
      - ${HOST_DATA_ROOT}/mqtt-broker:/mqtt-broker
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1883' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "local"
      options:
        max-size: "1m"
        max-file: "3"

  # ************************** Postgres **************************
  # One cluster serving every app's database (talosot, gentick_rms, …). PGDATA is
  # set explicitly and must be: the 18.x image moved its default and declares a
  # VOLUME above the mount point, so mounting at .../data without setting PGDATA
  # exits 1 with a wall of pg_upgrade text. DB/USER/PASSWORD apply on FIRST boot
  # only (an empty data dir).
  postgres:
    image: postgres:18.4-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    networks:
      - backend-net
    ports:
      - "127.0.0.1:5432:5432" # Secure: reachable only from the host (ssh + a client)
    volumes:
      - ${HOST_DATA_ROOT}/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "local"
      options:
        max-size: "1m"
        max-file: "3"

  # ************************** QuestDB (time-series — shared with TalosOT) **************************
  # Three ports, three protocols: 9000 HTTP (console + REST nexus writes through),
  # 9009 ILP (line protocol nexus streams into), 8812 PGWIRE (SQL api queries).
  # Only 8812 speaks SQL, and it is NOT the postgres service above. ILP and PGWIRE
  # are reachable inside backend-net by name; only the HTTP console is published.
  questdb:
    image: questdb/questdb:9.4.0
    container_name: questdb
    restart: unless-stopped
    environment:
      QDB_PG_USER: ${QUESTDB_USER}
      QDB_PG_PASSWORD: ${QUESTDB_PASSWORD}
      QDB_TELEMETRY_ENABLED: "false"
      JAVA_OPTS: "-Xms256m -Xmx768m"
      TZ: ${TZ}
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - backend-net
    volumes:
      - ${HOST_DATA_ROOT}/questdb:/var/lib/questdb
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "local"
      options:
        max-size: "1m"
        max-file: "3"

  # ************************** Redis **************************
  # Shared cache / KV. Provided for parity with gentick-infra and for apps that
  # adopt it (rms lists it as available infra). No LOCAL app consumes it today; it
  # starts idle and costs almost nothing. Reachable on backend-net by name; like
  # gentick-infra it is NOT published to the host.
  redis:
    image: redis:8.8.0
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --port 6379
    networks:
      - backend-net
    volumes:
      - ${HOST_DATA_ROOT}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "local"
      options:
        max-size: "1m"
        max-file: "3"


# ------------------ Networks -------------------
#
# `name:` pins it to `backend-net` rather than `local-infra_backend-net` (compose
# would otherwise prefix the project name, and every app stack joining it would
# have to hardcode that prefix).
#
# `external: true` — local-infra JOINS this network, it does not own it. On this
# dev box `backend-net` is a SHARED network that app stacks (saamsaam, talosot,
# rms) are already attached to; it lives outside any single compose project and
# everyone looks it up. This deliberately differs from gentick-infra, which OWNS
# the network because on the server it is the sole creator on a clean boot.
# Owning it here would (a) refuse to adopt the pre-existing unlabelled network
# ("has incorrect label com.docker.compose.network"), and (b) let a
# `docker compose down` here remove the network out from under the running app
# stacks. Create it once if it does not exist yet:
#   docker network create backend-net
networks:
  backend-net:
    external: true
    name: backend-net
