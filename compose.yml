# local-infra — SHARED PUBLIC INFRASTRUCTURE for this local dev box.
#
# The leaner, LOCAL equivalent of gentick-infra: it provides the backing
# services (nginx, postgres, mqtt, questdb, redis) that every app stack on this
# box — talosot, rms, safaura, … — reaches BY NAME over one shared docker
# network, so they can each run their own PRIVATE stack alongside it instead of
# every app bringing up its own postgres/nginx and colliding on ports 5432/80.
#
#   ./svc-build-env.sh          # build .env from .env.example (+ creds)
#   ./gen-nanomq-pwd.sh         # render the broker password file from .env
#   ./svc-start.sh              # bring these services up (scope=private default)
#
# or just: ./boot.sh            # does all three in order.
#
# Then in an app repo (e.g. talosot-edge-infra):
#   ./svc-start.sh --scope private
# and the app's api/nexus dial postgres/mqtt/questdb here by service name.
#
# ── Why everything lives in THIS compose.yml (no public/ split) ──────────
#
# A normal app-infra repo splits compose.yml (always ours) from
# public/compose.yml (backing services a host MIGHT already provide). local-infra
# IS the provider of those backing services — nothing else on this box supplies
# them — so from its own standpoint they are "always ours" and belong in
# compose.yml, the default `--scope private`. This mirrors gentick-infra, which
# is likewise a pure provider with a single compose file. See README.md.
#
# ── Two things that bite silently ────────────────────────────────────────
#
#   1. Compose interpolates .env, so a literal $ in a secret must be DOUBLED
#      (pa$$word). svc-build-env.sh handles this.
#   2. Do NOT set COMPOSE_PROJECT_NAME — it outranks `name:` below and would
#      rename every container on the box.
#
# Image tags live HERE, never in .env, so the running version is visible in git
# history rather than in an untracked file.

name: ${PROJECT_NAME:-local-infra}

# ── Network ──────────────────────────────────────────────────────────────
# ONE shared network, declared external here AND in every app stack. Compose
# refuses to adopt a network it did not create ("has incorrect label
# com.docker.compose.network"), so no compose file owns it — svc-start.sh
# creates a plain `backend-net` if it is missing, and every participant merely
# looks it up. Whoever starts first (usually local-infra) triggers the create.
networks:
  backend-net:
    external: true
    name: ${SHARED_NETWORK:-backend-net}

services:
  # ═══════════════════════════════════════════════════════════════════════
  # nginx — reverse proxy + static host for every app's web bundle.
  #
  # Routes by server_name (see nginx/nginx.conf): localhost / talosot.localhost
  # serve the talosot bundle and proxy /api → talosot-api, /mqtt → mqtt;
  # rms.localhost serves the rms bundle and proxies /api → rms-api. The bundles
  # are bind-mounted from nginx/html/<app>/ — a dev drops (or builds) each app's
  # web output there. nginx serves them straight from the working tree.
  #
  # The WHOLE nginx.conf is mounted (not just a server block into conf.d),
  # because the http block carries the `.mjs → text/javascript` mime fix a
  # Flutter --wasm build needs; without it the wasm path is dead on arrival.
  # ═══════════════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: ${NGINX_HOST:-nginx}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Africa/Johannesburg}
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    networks: [backend-net]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: { driver: "local", options: { max-size: "1m", max-file: "3" } }

  # ═══════════════════════════════════════════════════════════════════════
  # postgres — one cluster serving every app's database (talosot, rms, …).
  #
  # PGDATA is set explicitly, and must be. The 18.x image moved its default to
  # /var/lib/postgresql/18/docker and declares a VOLUME above the mount point;
  # mounting at .../data without setting PGDATA makes the container exit 1 with
  # a wall of pg_upgrade text. Verified against postgres:18.4-alpine — the same
  # way gentick-infra and talosot pin it.
  #
  # DB/USER/PASSWORD apply on FIRST boot only (an empty data dir). Additional
  # per-app databases are created inside this one cluster — see README.
  # ═══════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:18.4-alpine
    container_name: ${POSTGRES_HOST:-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?not set — run ./svc-build-env.sh, then start via ./svc-start.sh}
      POSTGRES_USER: ${POSTGRES_USER:?not set — run ./svc-build-env.sh, then start via ./svc-start.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?not set — run ./svc-build-env.sh, then start via ./svc-start.sh}
      PGDATA: /var/lib/postgresql/data
      PGPORT: ${POSTGRES_PORT:-5432}
      TZ: ${TZ:-Africa/Johannesburg}
    # Loopback-only: the cluster is reachable inside backend-net by name, and on
    # the host only from 127.0.0.1 (ssh + a client for access), never the LAN.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:${POSTGRES_PORT:-5432}"
    networks: [backend-net]
    volumes:
      - ${HOST_DATA_ROOT:-/srv/data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: { driver: "local", options: { max-size: "1m", max-file: "3" } }

  # ═══════════════════════════════════════════════════════════════════════
  # mqtt — NanoMQ broker (shared with TalosOT's Sparkplug B pipeline).
  #
  # The listen ports are FIXED in nanomq/nanomq.conf (1883 and 8083) — NanoMQ
  # has no env templating — so MQTT_PORT/MQTT_WS_PORT only DESCRIBE them; moving
  # one means editing nanomq.conf in the same commit. The account passwords live
  # in nanomq/nanomq_pwd.conf, which is GENERATED from the MQTT_*_USER/PASSWORD
  # values in .env by gen-nanomq-pwd.sh (nothing secret in git). Roles + ACL are
  # in nanomq/nanomq_acl.conf.
  #
  # Pinned to 0.24.13, NOT 0.24.14: 0.24.14 carries a WebSocket regression that
  # talosot-edge-infra pinned away from (commit c8b4e26) and a suspected fd leak
  # that wedged the broker on gentickit.local. Do not bump without re-testing a
  # browser session that reconnects repeatedly.
  # ═══════════════════════════════════════════════════════════════════════
  mqtt:
    image: emqx/nanomq:0.24.13-full
    container_name: ${MQTT_HOST:-mqtt}
    restart: unless-stopped
    command: ["--conf", "/etc/nanomq.conf"]
    environment:
      TZ: ${TZ:-Africa/Johannesburg}
    # The container default of 1024 fds is low for a broker and is what turned a
    # slow leak into an outage on the server. Raise the ceiling; it does not fix
    # a leak, so a rising fd count is still a bug.
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-1883}:${MQTT_PORT:-1883}"
      - "127.0.0.1:${MQTT_WS_HOST_PORT:-8083}:${MQTT_WS_PORT:-8083}"
    networks: [backend-net]
    volumes:
      - ./nanomq/nanomq.conf:/etc/nanomq.conf:ro
      - ./nanomq/nanomq_pwd.conf:/etc/nanomq_pwd.conf:ro
      - ./nanomq/nanomq_acl.conf:/etc/nanomq_acl.conf:ro
      - ${HOST_DATA_ROOT:-/srv/data}/mqtt-broker:/mqtt-broker
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${MQTT_PORT:-1883}' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: { driver: "local", options: { max-size: "1m", max-file: "3" } }

  # ═══════════════════════════════════════════════════════════════════════
  # questdb — time-series store for Sparkplug metrics (shared with TalosOT).
  #
  # Three ports, three protocols, easy to confuse:
  #   9000  HTTP    web console + the REST endpoint nexus writes through
  #   9009  ILP     the line protocol nexus streams into
  #   8812  PGWIRE  postgres wire protocol, which api queries over
  # Only 8812 speaks SQL, and it is NOT the postgres service above.
  # ═══════════════════════════════════════════════════════════════════════
  questdb:
    image: questdb/questdb:9.4.0
    container_name: ${QUESTDB_HOST:-questdb}
    restart: unless-stopped
    environment:
      QDB_PG_USER: ${QUESTDB_USER:?not set — run ./svc-build-env.sh, then start via ./svc-start.sh}
      QDB_PG_PASSWORD: ${QUESTDB_PASSWORD:?not set — run ./svc-build-env.sh, then start via ./svc-start.sh}
      QDB_TELEMETRY_ENABLED: "false"
      JAVA_OPTS: "-Xms256m -Xmx768m"
      TZ: ${TZ:-Africa/Johannesburg}
    ports:
      - "127.0.0.1:${QUESTDB_HTTP_HOST_PORT:-9000}:${QUESTDB_HTTP_PORT:-9000}"
    networks: [backend-net]
    volumes:
      - ${HOST_DATA_ROOT:-/srv/data}/questdb:/var/lib/questdb
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${QUESTDB_HTTP_PORT:-9000}' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: { driver: "local", options: { max-size: "1m", max-file: "3" } }

  # ═══════════════════════════════════════════════════════════════════════
  # redis — shared cache / KV. Provided for parity with gentick-infra and for
  # apps that adopt it (rms lists it as available infra). No LOCAL app consumes
  # it today; it starts idle and costs almost nothing. Drop this block if you
  # want an even leaner box.
  #
  # Redis takes its config as command args, so the port must be in .env too.
  # ═══════════════════════════════════════════════════════════════════════
  redis:
    image: redis:8.8.0
    container_name: ${REDIS_HOST:-redis}
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?not set — run ./svc-build-env.sh} --port ${REDIS_PORT:-6379}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:${REDIS_PORT:-6379}"
    networks: [backend-net]
    volumes:
      - ${HOST_DATA_ROOT:-/srv/data}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_PORT:-6379} -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: { driver: "local", options: { max-size: "1m", max-file: "3" } }
