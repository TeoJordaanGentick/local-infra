# local-infra — shared nginx for the local dev box.
#
# This is the WHOLE nginx.conf (it replaces the image's /etc/nginx/nginx.conf),
# not a server block dropped into conf.d — because the http block below carries
# the `.mjs → text/javascript` mime fix a Flutter --wasm build needs.
#
# Routing is by server_name, and every name resolves with NO hosts-file edit:
#
#   localhost, talosot.localhost   → talosot bundle + /api→talosot-api, /mqtt→mqtt
#   rms.localhost                  → rms bundle     + /api→rms-api
#   saamsaam.localhost             → saamsaam bundle + /api→saamsaam-api
#
# The per-app names use the `.localhost` TLD, which browsers resolve to 127.0.0.1
# automatically (RFC 6761) — no hosts entry, no DNS server, no admin. Adding an
# app is a new server_name here and nothing else. `localhost` itself is the
# talosot default vhost; move `default_server` to another `listen` line to change
# that. (Only a NON-browser tool — curl.exe, etc. — fails to resolve *.localhost;
# if one ever needs it, add `127.0.0.1 <app>.localhost` to the OS hosts file.)
#
# Upstreams are addressed by CONTAINER name (talosot-api, rms-api), not service
# name (api), because the service name is unprefixed and any other stack on the
# shared network could claim it. The variable-form proxy_pass + resolver make
# nginx re-resolve those names every 10s instead of pinning an IP at load time,
# so a `compose up` that reshuffles container IPs does not send /api to the
# wrong upstream.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # nginx's bundled mime.types has no entry for .mjs, so it falls through to
    # application/octet-stream. ES modules are MIME-STRICT: a browser refuses to
    # evaluate a module script not served with a JavaScript type, and the only
    # symptom is "Failed to fetch dynamically imported module". A Flutter --wasm
    # build loads main.dart.mjs via dynamic import(), so without this the whole
    # WebAssembly path is dead while the dart2js fallback quietly keeps working.
    types {
        text/javascript  mjs;
    }

    # ══════════════════════════════════════════════════════════════════════
    # TalosOT — the localhost default.
    # Serves the Flutter console-user SPA from nginx/html/talosot and proxies
    # /api → talosot-api:8080 and the /mqtt WebSocket → mqtt:8083.
    # ══════════════════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        server_name localhost talosot.localhost;

        access_log  /var/log/nginx/talosot.access.log;
        error_log   /var/log/nginx/talosot.error.log;

        resolver 127.0.0.11 valid=10s ipv6=off;

        root /usr/share/nginx/html/talosot;
        index index.html;

        # Liveness for the compose healthcheck / a quick curl.
        location = /healthz { default_type text/plain; return 200 "ok\n"; }

        # Default for this vhost: revalidate. Flutter reuses the same filenames
        # every build, so anything NOT carrying a content hash must be checked.
        # ETag makes that a 304, not a re-download. Locations that set their own
        # add_header below do not inherit this — deliberate.
        add_header Cache-Control "no-cache" always;

        # ── Content-hashed files → cache forever ───────────────────────────
        # The build renames main.dart.js and the tree-shaken icon font to carry
        # an md5 fragment, so a new build is a new URL and nothing needs
        # invalidating. nginx checks regex locations in FILE ORDER and they beat
        # prefix locations, so the /emu/ variants come FIRST and repeat the root
        # override (a regex location does not inherit the root of `location
        # /emu/`). Flutter's entrypoints carry a COMPOUND suffix
        # (main.<hash>.dart.js / .wasm / .mjs), so the hash lands mid-name — the
        # .dart.* patterns exist for exactly that shape.
        location ~ "^/emu/.*\.[0-9a-f]{6,}\.dart\.(js|wasm|mjs)$" {
            root /usr/share/nginx/html/talosot-emulator;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        location ~ "^/emu/.*\.[0-9a-f]{6,}\.(js|mjs|otf|ttf|woff2?|png|jpg|jpeg|gif|svg|wasm)$" {
            root /usr/share/nginx/html/talosot-emulator;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        location ~ "\.[0-9a-f]{6,}\.dart\.(js|wasm|mjs)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        location ~ "\.[0-9a-f]{6,}\.(js|mjs|otf|ttf|woff2?|png|jpg|jpeg|gif|svg|wasm)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # API reverse proxy → talosot-api:8080. The rewrite strips /api/ because
        # variable-form proxy_pass does not auto-strip the location prefix.
        location /api/ {
            set $api           http://talosot-api:8080;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         $api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Real assets must 404 when missing instead of falling through to the SPA
        # shell — otherwise a broken build returns 200 + HTML for a .otf/.wasm and
        # the only symptom is a vague "Failed to load font". The /emu/ variant
        # comes first and repeats the root override, same reason as above.
        location ~ ^/(assets|canvaskit)/ {
            try_files $uri =404;
        }
        location ~ "^/emu/.+\.(js|mjs|json|wasm|otf|ttf|woff2?|map|png|jpg|jpeg|gif|svg|ico|css)$" {
            root /usr/share/nginx/html/talosot-emulator;
            try_files $uri =404;
        }
        location ~ "\.(js|mjs|json|wasm|otf|ttf|woff2?|map|png|jpg|jpeg|gif|svg|ico|css)$" {
            try_files $uri =404;
        }

        # ── Sparkplug B device emulator (Flutter SPA, built --base-href=/emu/) ─
        # `root` (not `alias`) is correct: the bundle lives at <root>/emu/. The
        # leading-slash fallback keeps a deep-link reload inside the emulator.
        location ~ ^/emu/(assets|canvaskit)/ {
            root /usr/share/nginx/html/talosot-emulator;
            try_files $uri =404;
        }
        location /emu/ {
            root /usr/share/nginx/html/talosot-emulator;
            index index.html;
            try_files $uri $uri/ /emu/index.html;
        }

        # MQTT-over-WebSocket bridge for the Flutter SPA. The browser opens this
        # WS directly to the broker and subscribes to Sparkplug B topics.
        location /mqtt {
            set $mqtt           http://mqtt:8083;
            proxy_pass          $mqtt;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection "Upgrade";
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # Dashboard SPA — Flutter web uses client-side routing.
        location / {
            try_files $uri $uri/ /index.html;
        }

        gzip on;
        gzip_min_length 512;
        gzip_types text/plain text/css application/javascript text/javascript application/json application/wasm font/woff2 image/svg+xml;
    }

    # ══════════════════════════════════════════════════════════════════════
    # RMS — reachable at http://rms.localhost/ (needs the optional hosts entry).
    # Serves the React SPA from nginx/html/rms and proxies /api → rms-api:8080.
    #
    # This is the TEMPLATE for adding another app: copy this block, change the
    # server_name, the root, and the /api upstream container name. It is live —
    # it just 404s until you drop an rms bundle into nginx/html/rms and start
    # rms's private stack (rms-api). See README → "Add another app".
    # ══════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name rms.localhost;

        access_log  /var/log/nginx/rms.access.log;
        error_log   /var/log/nginx/rms.error.log;

        resolver 127.0.0.11 valid=10s ipv6=off;

        root /usr/share/nginx/html/rms;
        index index.html;

        location = /healthz { default_type text/plain; return 200 "ok\n"; }

        # Vite emits content-hashed filenames under /assets/ → cache forever.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location /api/ {
            set $api http://rms-api:8080;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Everything else → React SPA (client-side routing).
        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }

        gzip on;
        gzip_min_length 512;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    }

    # ══════════════════════════════════════════════════════════════════════
    # SaamSaam — reachable at http://saamsaam.localhost/.
    # Serves the Flutter web bundle from nginx/html/saamsaam and proxies
    # /api → saamsaam-api:8080.
    #
    # Modelled on the rms template, but with the talosot vhost's Flutter cache
    # and asset-404 locations: saamsaam-frontend is a Flutter app whose bundle
    # is content-hashed by build-web.sh, and a missing .otf/.wasm must 404
    # rather than fall through to the SPA shell (a 200 + HTML reads as a vague
    # "failed to load font").
    #
    # /api is STRIPPED before proxying: the API serves at /v1, not /api/v1, so
    # /api/v1/auth/login must reach the upstream as /v1/auth/login. Same
    # variable-form proxy_pass + resolver as the other vhosts, so a not-yet-
    # running upstream is resolved per request and does not break nginx boot.
    #
    # Upstream is saamsaam-api: SaamSaam now runs ONE instance per box (the
    # staging/live split was collapsed), so the single dev-box container is the
    # only upstream. It polls its own dedicated dev Telegram bot token, distinct
    # from production, so there is no 409 fight and no reason to keep it stopped.
    # sm.teojordaan.com (the tunnel) is deliberately NOT added yet — the tunnel
    # port is a pending decision; saamsaam.localhost is the only name for now.
    # ══════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name saamsaam.localhost sm.teojordaan.com;

        access_log  /var/log/nginx/saamsaam.access.log;
        error_log   /var/log/nginx/saamsaam.error.log;

        resolver 127.0.0.11 valid=10s ipv6=off;

        root /usr/share/nginx/html/saamsaam;
        index index.html;

        location = /healthz { default_type text/plain; return 200 "ok\n"; }

        # Default: revalidate. Flutter reuses the same filenames every build, so
        # anything without a content hash must be checked (a 304 via ETag).
        add_header Cache-Control "no-cache" always;

        # ── Content-hashed files → cache forever ───────────────────────────
        # build-web.sh renames main.dart.js and the tree-shaken icon font to
        # carry an md5 fragment (compound suffix main.<hash>.dart.js), so a new
        # build is a new URL and nothing needs invalidating.
        location ~ "\.[0-9a-f]{6,}\.dart\.(js|wasm|mjs)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        location ~ "\.[0-9a-f]{6,}\.(js|mjs|otf|ttf|woff2?|png|jpg|jpeg|gif|svg|wasm)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # API reverse proxy → saamsaam-api:8080. The rewrite strips /api/
        # because the API serves at /v1 and variable-form proxy_pass does not
        # auto-strip the location prefix.
        location /api/ {
            set $api           http://saamsaam-api:8080;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         $api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Real assets must 404 when missing instead of falling through to the SPA
        # shell — otherwise a broken build returns 200 + HTML for a .otf/.wasm.
        location ~ ^/(assets|canvaskit)/ {
            try_files $uri =404;
        }
        location ~ "\.(js|mjs|json|wasm|otf|ttf|woff2?|map|png|jpg|jpeg|gif|svg|ico|css)$" {
            try_files $uri =404;
        }

        # Flutter web uses client-side routing.
        location / {
            try_files $uri $uri/ /index.html;
        }

        gzip on;
        gzip_min_length 512;
        gzip_types text/plain text/css application/javascript text/javascript application/json application/wasm font/woff2 image/svg+xml;
    }
}
