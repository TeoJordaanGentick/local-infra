# local-infra — shared nginx for the local dev box.
#
# This is the WHOLE nginx.conf (it replaces the image's /etc/nginx/nginx.conf),
# not a server block dropped into conf.d — because the http block below carries
# the `.mjs → text/javascript` mime fix a Flutter --wasm build needs.
#
# Routing is by server_name, and every name resolves with NO hosts-file edit:
#
#   localhost, talosot.localhost   → talosot bundle + /api→talosot-api, /mqtt→mqtt
#   rms.localhost                  → rms bundle     + /api→rms-api
#   saamsaam.localhost             → saamsaam bundle + /api→saamsaam-api
#   gen1.localhost                 → gen1 staging console container
#   gen1api.localhost              → gen1 staging api, /query→go-data
#   mqtt.localhost                 → / and /mqtt→mqtt (MQTT over WebSocket, LoRadian devices)
#
# Tunnel hostnames (this laptop's Cloudflare tunnel, ingress → http://nginx:80;
# Cloudflare terminates TLS, so these listen plain HTTP like the rest):
#   sm.teojordaan.com → saamsaam, gen-1.teojordaan.com → gen1 console,
#   gen1api.teojordaan.com → gen1 api, mqtt.teojordaan.com → mqtt
#
# The per-app names use the `.localhost` TLD, which browsers resolve to 127.0.0.1
# automatically (RFC 6761) — no hosts entry, no DNS server, no admin. Adding an
# app is a new server_name here and nothing else. `localhost` itself is the
# talosot default vhost; move `default_server` to another `listen` line to change
# that. (Only a NON-browser tool — curl.exe, etc. — fails to resolve *.localhost;
# if one ever needs it, add `127.0.0.1 <app>.localhost` to the OS hosts file.)
#
# Upstreams are addressed by CONTAINER name (talosot-api, rms-api), not service
# name (api), because the service name is unprefixed and any other stack on the
# shared network could claim it. The variable-form proxy_pass + resolver make
# nginx re-resolve those names every 10s instead of pinning an IP at load time,
# so a `compose up` that reshuffles container IPs does not send /api to the
# wrong upstream.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # nginx's bundled mime.types has no entry for .mjs, so it falls through to
    # application/octet-stream. ES modules are MIME-STRICT: a browser refuses to
    # evaluate a module script not served with a JavaScript type, and the only
    # symptom is "Failed to fetch dynamically imported module". A Flutter --wasm
    # build loads main.dart.mjs via dynamic import(), so without this the whole
    # WebAssembly path is dead while the dart2js fallback quietly keeps working.
    types {
        text/javascript  mjs;
    }

    # ══════════════════════════════════════════════════════════════════════
    # TalosOT — the localhost default.
    # Serves the Flutter console-user SPA from nginx/html/talosot and proxies
    # /api → talosot-api:8080 and the /mqtt WebSocket → mqtt:8083.
    # ══════════════════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        server_name localhost talosot.localhost;

        access_log  /var/log/nginx/talosot.access.log;
        error_log   /var/log/nginx/talosot.error.log;

        resolver 127.0.0.11 valid=10s ipv6=off;

        root /usr/share/nginx/html/talosot;
        index index.html;

        # Liveness for the compose healthcheck / a quick curl.
        location = /healthz { default_type text/plain; return 200 "ok\n"; }

        # Default for this vhost: revalidate. Flutter reuses the same filenames
        # every build, so anything NOT carrying a content hash must be checked.
        # ETag makes that a 304, not a re-download. Locations that set their own
        # add_header below do not inherit this — deliberate.
        add_header Cache-Control "no-cache" always;

        # ── Content-hashed files → cache forever ───────────────────────────
        # The build renames main.dart.js and the tree-shaken icon font to carry
        # an md5 fragment, so a new build is a new URL and nothing needs
        # invalidating. nginx checks regex locations in FILE ORDER and they beat
        # prefix locations, so the /emu/ variants come FIRST and repeat the root
        # override (a regex location does not inherit the root of `location
        # /emu/`). Flutter's entrypoints carry a COMPOUND suffix
        # (main.<hash>.dart.js / .wasm / .mjs), so the hash lands mid-name — the
        # .dart.* patterns exist for exactly that shape.
        location ~ "^/emu/.*\.[0-9a-f]{6,}\.dart\.(js|wasm|mjs)$" {
            root /usr/share/nginx/html/talosot-emulator;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        location ~ "^/emu/.*\.[0-9a-f]{6,}\.(js|mjs|otf|ttf|woff2?|png|jpg|jpeg|gif|svg|wasm)$" {
            root /usr/share/nginx/html/talosot-emulator;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        location ~ "\.[0-9a-f]{6,}\.dart\.(js|wasm|mjs)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        location ~ "\.[0-9a-f]{6,}\.(js|mjs|otf|ttf|woff2?|png|jpg|jpeg|gif|svg|wasm)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # API reverse proxy → talosot-api:8080. The rewrite strips /api/ because
        # variable-form proxy_pass does not auto-strip the location prefix.
        location /api/ {
            set $api           http://talosot-api:8080;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         $api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Real assets must 404 when missing instead of falling through to the SPA
        # shell — otherwise a broken build returns 200 + HTML for a .otf/.wasm and
        # the only symptom is a vague "Failed to load font". The /emu/ variant
        # comes first and repeats the root override, same reason as above.
        location ~ ^/(assets|canvaskit)/ {
            try_files $uri =404;
        }
        location ~ "^/emu/.+\.(js|mjs|json|wasm|otf|ttf|woff2?|map|png|jpg|jpeg|gif|svg|ico|css)$" {
            root /usr/share/nginx/html/talosot-emulator;
            try_files $uri =404;
        }
        location ~ "\.(js|mjs|json|wasm|otf|ttf|woff2?|map|png|jpg|jpeg|gif|svg|ico|css)$" {
            try_files $uri =404;
        }

        # ── Sparkplug B device emulator (Flutter SPA, built --base-href=/emu/) ─
        # `root` (not `alias`) is correct: the bundle lives at <root>/emu/. The
        # leading-slash fallback keeps a deep-link reload inside the emulator.
        location ~ ^/emu/(assets|canvaskit)/ {
            root /usr/share/nginx/html/talosot-emulator;
            try_files $uri =404;
        }
        location /emu/ {
            root /usr/share/nginx/html/talosot-emulator;
            index index.html;
            try_files $uri $uri/ /emu/index.html;
        }

        # MQTT-over-WebSocket bridge for the Flutter SPA. The browser opens this
        # WS directly to the broker and subscribes to Sparkplug B topics.
        location /mqtt {
            set $mqtt           http://mqtt:8083;
            proxy_pass          $mqtt;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection "Upgrade";
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # Dashboard SPA — Flutter web uses client-side routing.
        location / {
            try_files $uri $uri/ /index.html;
        }

        gzip on;
        gzip_min_length 512;
        gzip_types text/plain text/css application/javascript text/javascript application/json application/wasm font/woff2 image/svg+xml;
    }

    # ══════════════════════════════════════════════════════════════════════
    # RMS — reachable at http://rms.localhost/ (needs the optional hosts entry).
    # Serves the React SPA from nginx/html/rms and proxies /api → rms-api:8080.
    #
    # This is the TEMPLATE for adding another app: copy this block, change the
    # server_name, the root, and the /api upstream container name. It is live —
    # it just 404s until you drop an rms bundle into nginx/html/rms and start
    # rms's private stack (rms-api). See README → "Add another app".
    # ══════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name rms.localhost;

        access_log  /var/log/nginx/rms.access.log;
        error_log   /var/log/nginx/rms.error.log;

        resolver 127.0.0.11 valid=10s ipv6=off;

        root /usr/share/nginx/html/rms;
        index index.html;

        location = /healthz { default_type text/plain; return 200 "ok\n"; }

        # Vite emits content-hashed filenames under /assets/ → cache forever.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location /api/ {
            set $api http://rms-api:8080;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Everything else → React SPA (client-side routing).
        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }

        gzip on;
        gzip_min_length 512;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    }

    # ------------------------------------------------------------------
    # SaamSaam — saamsaam.localhost (and sm.teojordaan.com through the dev tunnel).
    # MIRRORS gentick-infra's saamsaam block (server_name aside) so the dev box
    # tests the same cache and 404 rules the server runs. Change both together.
    # Serves the Flutter web bundle from nginx/html/saamsaam and proxies
    # /api → saamsaam-api:8080 (the saamsaam-infra private stack, joined to
    # backend-net with --scope private).
    #
    # This hostname is NOT on the Gentick tunnel. It arrives through
    # SaamSaam's own connector (cloudflared in saamsaam-infra's compose.yml,
    # on backend-net), running a tunnel on Teo's personal Cloudflare account
    # whose public hostname maps to http://nginx:80. The connector belongs to
    # the app, not to this shared stack; server_name is what separates the
    # two tunnels' traffic here.
    #
    # /api is STRIPPED before proxying: the API serves at /v1, not /api/v1.
    # Upstream is the CONTAINER name (saamsaam-api); the service name `api`
    # would collide with other stacks on backend-net.
    #
    # Cache rules follow agollum/flutter/nginx-flutter-cache.conf: only
    # content-hashed files are cached forever, every stable Flutter filename
    # revalidates, and real asset misses return 404 instead of the SPA shell.
    # The bundle is built with --canvaskit local (SaamSaam's offline boot and
    # CSP need it), so /canvaskit/ is actually served here and must revalidate:
    # canvaskit.wasm keeps its name across Flutter upgrades while its bytes
    # change. add_header does not merge across levels, so each location below
    # carries its own Cache-Control.
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name saamsaam.localhost sm.teojordaan.com;

        access_log  /var/log/nginx/saamsaam.access.log;
        error_log   /var/log/nginx/saamsaam.error.log;

        resolver 127.0.0.11 valid=10s ipv6=off;

        root /usr/share/nginx/html/saamsaam;
        index index.html;

        # Liveness for a quick curl through the tunnel.
        location = /healthz { default_type text/plain; return 200 "ok\n"; }

        # ── Entry points and per-build metadata: always revalidate ─────
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
        location = /flutter_bootstrap.js {
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
        location ~ ^/(flutter\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }
        location ~ ^/assets/(AssetManifest[^/]*|FontManifest\.json|NOTICES)$ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # ── CanvasKit: stable names, contents change on SDK upgrade ────
        location ^~ /canvaskit/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # ── Content-hashed files → cache forever ───────────────────────
        # Flutter's entrypoints carry a COMPOUND suffix (main.<hash>.dart.js),
        # so the hash lands mid-name; the .dart.* pattern exists for that.
        location ~ "\.[0-9a-f]{6,}\.dart\.(js|wasm|mjs)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        location ~ "\.[0-9a-f]{6,}\.(js|mjs|otf|ttf|woff2?|png|jpg|jpeg|gif|svg|wasm)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
            try_files $uri =404;
        }

        # ── API reverse proxy → saamsaam-api:8080 ──────────────────────
        # Variable-form proxy_pass + the resolver above re-resolve the
        # container every 10s, and let nginx boot while the api is down.
        location /api/ {
            set $api           http://saamsaam-api:8080;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         $api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ── Un-hashed app assets: revalidate, and 404 when missing ─────
        # A missing .otf/.wasm/.json must not come back as 200 + index.html.
        location ^~ /assets/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }
        location ~ "\.(js|mjs|json|wasm|otf|ttf|woff2?|map|png|jpg|jpeg|gif|svg|ico|css)$" {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # ── SPA routing: the only place the index fallback belongs ─────
        location / {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }

        gzip on;
        gzip_min_length 512;
        gzip_types text/plain text/css application/javascript text/javascript application/json application/wasm font/woff2 image/svg+xml;
    }

    # Forwarded scheme as the tunnel saw it (https), falling back to this hop's.
    # Mirrors gen1-infra's public/nginx: Laravel builds its absolute URLs from it.
    map $http_x_forwarded_proto $gen1_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # ------------------------------------------------------------------
    # gen1 console — gen1.localhost, and gen-1.teojordaan.com through this
    # laptop's Cloudflare tunnel (LoRadian stage 1, loradian-firmware
    # _docs/plan/server/deploy.md). The tunnel's dashboard ingress maps the
    # hostname to http://nginx:80; server_name is what routes it here.
    #
    # Everything goes to gen1-infra's staging console container: this box runs
    # the -staging images. The container is an unprivileged nginx on 8080 (not
    # 80: uid 101 cannot bind a privileged port) and serves its own bundle,
    # cache rules and /config.json, so none of that is repeated here. The
    # console reaches the API on gen1api.teojordaan.com, not through this host.
    #
    # The upstream is resolved per request, so nginx starts while gen1 is down
    # (that vhost then answers 502 instead of nginx refusing to boot).
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name gen1.localhost gen-1.teojordaan.com;

        access_log  /var/log/nginx/gen1.access.log;
        error_log   /var/log/nginx/gen1.error.log;

        resolver 127.0.0.11 valid=10s ipv6=off;

        location / {
            set $console       http://gen1-web-staging:8080;
            proxy_pass         $console;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $gen1_forwarded_proto;
        }
    }

    # ------------------------------------------------------------------
    # gen1 API — gen1api.localhost, and gen1api.teojordaan.com through the
    # tunnel. Staging slot, mirroring the `stagingapi.` server of gen1-infra's
    # public/nginx: everything to the API with the path kept, /query/ to the
    # query API (go-data, which serves both slots), and the same 20 MB body
    # limit for logo and note-photo uploads. Upstreams resolve per request, as
    # above.
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name gen1api.localhost gen1api.teojordaan.com;

        access_log  /var/log/nginx/gen1api.access.log;
        error_log   /var/log/nginx/gen1api.error.log;

        resolver 127.0.0.11 valid=10s ipv6=off;

        client_max_body_size 20m;

        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $gen1_forwarded_proto;

        location ^~ /query/ {
            set $query         http://go-data:80;
            proxy_pass         $query;
        }
        location / {
            set $api           http://gen1-api-staging:80;
            proxy_pass         $api;
        }
    }

    # ------------------------------------------------------------------
    # Broker — mqtt.localhost, and mqtt.teojordaan.com through this laptop's
    # Cloudflare tunnel. LoRadian gateways connect to
    # wss://mqtt.teojordaan.com: a tunnel carries HTTP and WebSocket, not
    # raw MQTT on 1883, so devices speak MQTT over WebSocket and Cloudflare
    # terminates the TLS (D37). Only / and /mqtt are served; this hostname has
    # no site.
    #
    # Both paths reach NanoMQ's ws listener, which is bound at 8083/mqtt
    # (nanomq/nanomq.conf). / is accepted because clients may be given the bare
    # host, and /mqtt because most MQTT-over-WebSocket libraries default to it.
    #
    # Timeouts: nginx closes an upstream that is silent for proxy_read_timeout,
    # so it must exceed the clients' MQTT keepalive by a wide margin; 3600s, as
    # the talosot /mqtt bridge. Cloudflare closes an idle WebSocket after about
    # 100 s on its own, so device keepalive must stay below that regardless.
    # Buffering off so each MQTT frame is forwarded as it arrives.
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name mqtt.localhost mqtt.teojordaan.com;

        access_log  /var/log/nginx/mqtt.access.log;
        error_log   /var/log/nginx/mqtt.error.log;

        resolver 127.0.0.11 valid=10s ipv6=off;

        location = /healthz { default_type text/plain; return 200 "ok\n"; }

        location = /mqtt {
            set $mqtt           http://mqtt:8083;
            proxy_pass          $mqtt;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection "Upgrade";
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering     off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # The bare host: NanoMQ listens only at /mqtt, so the upstream path is set here.
        location = / {
            set $mqtt           http://mqtt:8083/mqtt;
            proxy_pass          $mqtt;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection "Upgrade";
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering     off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        location / { return 404; }
    }
}
