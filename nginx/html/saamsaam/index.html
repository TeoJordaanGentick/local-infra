<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Only styles the loading screen: the engine replaces every viewport meta
       at start-up. interactive-widget is added after the first frame, in
       lib/core/keyboard/web_keyboard_web.dart. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1B6EF3">
  <title>SaamSaam</title>
  <!-- Flutter substitutes this at build time: "/" by default, or whatever
       --base-href was passed. Hardcoding "/" here makes --base-href a fatal
       build error ("Failed to find the placeholder for base href"), so the app
       could never be served from a subpath. nginx serves it at the domain root
       today, which is why nobody hit it until the build scripts were reworked. -->
  <base href="/">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <style>
    /* Flutter owns all scrolling; the document must never scroll (S12, the CSS
       half of the keyboard fix). The engine pins <body> with inline styles,
       including overflow: hidden, but hidden still allows programmatic
       scrolling, so the browser may scroll the body to reveal the engine's
       hidden text input when the keyboard opens. clip forbids that;
       !important beats the engine's inline value. On <html> the value applies
       to the viewport, where clip acts as hidden. Tested on Android Chrome
       together with the viewport meta change (staging probe, 2026-11-24). */
    html, body { height: 100%; margin: 0; overflow: clip !important; overscroll-behavior: none; }
    body { user-select: none; -webkit-user-select: none; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; font-family: system-ui, sans-serif; color: #666;
    }
  </style>
  <!-- PWA app-shell bridge (sync-engine v2 M4). Runs BEFORE flutter_bootstrap.js
       for two reasons that both need to happen early:
         1. `beforeinstallprompt` fires once, before Flutter boots. We capture
            and stash it so the Settings "Add to Home Screen" control can fire
            the native prompt later.
         2. Flutter 3.29+ still registers a deprecated, self-unregistering stub
            service worker (flutter_service_worker.js). We own the caching shell
            SW, so we intercept navigator.serviceWorker.register to swallow that
            stub — otherwise the two collide on scope '/' and the stub's
            self-unregister can tear ours down. (The clean long-term fix is a
            `--pwa-strategy=none` build; that is an agollum build-flag change,
            reported separately. This interception is the repo-only equivalent.)
       Everything the Dart runtime (pwa_runtime_web.dart) needs is exposed on the
       single window.__saamsaamPwa object. -->
  <script>
    (function () {
      var bridge = {
        deferredPrompt: null,
        canInstall: function () { return !!bridge.deferredPrompt; },
        isStandalone: function () {
          try {
            return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
                   window.navigator.standalone === true;
          } catch (e) { return false; }
        },
        isIos: function () {
          var ua = window.navigator.userAgent || '';
          var iOSDevice = /iPad|iPhone|iPod/.test(ua);
          // iPadOS 13+ reports as a Mac but has touch — catch it too.
          var iPadOS = window.navigator.platform === 'MacIntel' &&
                       window.navigator.maxTouchPoints > 1;
          return iOSDevice || iPadOS;
        },
        promptInstall: function () {
          var e = bridge.deferredPrompt;
          if (!e) return Promise.resolve(false);
          try {
            e.prompt();
            return e.userChoice.then(function (choice) {
              // The event can only be used once.
              bridge.deferredPrompt = null;
              notifyChange();
              return choice && choice.outcome === 'accepted';
            });
          } catch (err) {
            return Promise.resolve(false);
          }
        },
        requestPersistentStorage: function () {
          try {
            if (navigator.storage && navigator.storage.persist) {
              return navigator.storage.persisted().then(function (already) {
                if (already) return true;
                return navigator.storage.persist();
              });
            }
          } catch (e) {}
          return Promise.resolve(false);
        },
        applyUpdate: function () {
          // The service worker serves every stable-named shell file
          // network-first, so a reload picks up the new build whenever the
          // server answers. What a reload alone can miss is a new service
          // worker: ask the browser for it first and, if one is installing,
          // reload only once it controls this page (it skips waiting and claims
          // clients), so the reload runs under the new worker. Bounded, so a
          // server that does not answer still ends in a reload.
          var reload = function () { window.location.reload(); };
          var sw = navigator.serviceWorker;
          if (!sw || !sw.getRegistration) {
            reload();
            return Promise.resolve();
          }
          var pickUpWorker = purgeShell(sw).then(function () {
            return sw.getRegistration();
          }).then(function (reg) {
            if (!reg) return;
            // Listen before asking, so a new worker that takes control while
            // update() is still settling is not missed.
            var controlled = new Promise(function (resolve) {
              sw.addEventListener('controllerchange', resolve, { once: true });
            });
            return reg.update().then(function () {
              if (!reg.installing && !reg.waiting) return;
              return controlled;
            });
          });
          var deadline = new Promise(function (resolve) { setTimeout(resolve, 10000); });
          return Promise.race([pickUpWorker, deadline])
            .catch(function () {})
            .then(reload);
        },
      };

      // Asks the worker in control to empty its shell cache, and resolves once
      // it acknowledges (or after 1.5 s). A client still on the pre-Y
      // cache-first worker reaches a new build only this way: Cloudflare kept
      // serving that worker's own script, so update() found nothing new to
      // install. The current worker only acknowledges, keeping its offline
      // copy.
      function purgeShell(sw) {
        return new Promise(function (resolve) {
          try {
            if (!sw.controller) return resolve();
            var channel = new MessageChannel();
            channel.port1.onmessage = function () { resolve(); };
            sw.controller.postMessage({ type: 'PURGE_SHELL' }, [channel.port2]);
            setTimeout(resolve, 1500);
          } catch (e) {
            resolve();
          }
        });
      }

      function notifyChange() {
        try { window.dispatchEvent(new Event('saamsaam-pwa-change')); } catch (e) {}
      }

      window.__saamsaamPwa = bridge;

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        bridge.deferredPrompt = e;
        notifyChange();
      });
      window.addEventListener('appinstalled', function () {
        bridge.deferredPrompt = null;
        notifyChange();
      });

      // Suppress Flutter's deprecated stub SW registration (see comment above).
      if ('serviceWorker' in navigator && navigator.serviceWorker.register) {
        var nativeRegister = navigator.serviceWorker.register.bind(navigator.serviceWorker);
        navigator.serviceWorker.register = function (url, opts) {
          if (String(url).indexOf('flutter_service_worker.js') !== -1) {
            // Hand Flutter a resolved-but-empty registration; its loader
            // tolerates the failure and boots normally.
            return Promise.resolve(undefined);
          }
          return nativeRegister(url, opts);
        };
        // Register our own shell service worker. Relative URL → resolves against
        // <base href>, so the scope is correct for a subpath deploy too.
        window.addEventListener('load', function () {
          nativeRegister('service_worker.js').catch(function (err) {
            console.warn('shell service worker registration failed:', err);
          });
        });
      }
    })();
  </script>
</head>
<body>
  <div id="loading">Loading SaamSaam…</div>
  <script src="flutter_bootstrap.js" type="application/javascript"></script>
</body>
</html>
